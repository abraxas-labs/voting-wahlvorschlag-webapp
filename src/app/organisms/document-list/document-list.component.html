<bc-table
  #selection="selection"
  selection
  [selectionMultiple]="true"
  (selectionChange)="onSelectionChange($event)"
  documentSort="sort"
  sort
  [dataSource]="dataSource"
>
  <ng-container columnDef="selection">
    <th bc-header-cell *headerCellDef>
      <bc-checkbox
        selectAll
        [checked]="selection.isAllSelected()"
        [indeterminate]="selection.isPartialSelected()"
      ></bc-checkbox>
    </th>
    <td bc-data-cell *dataCellDef="let row">
      <bc-checkbox
        [checked]="selection.isSelected(row)"
        selectionToggle
        [selectionToggleValue]="row"
      ></bc-checkbox>
    </td>
  </ng-container>

  <ng-container [columnDef]="columns.name">
    <th bc-header-cell sort *headerCellDef>{{ 'DOCUMENT.NAME' | translate }}</th>
    <td bc-data-cell *dataCellDef="let row">
      {{ row.name }}
    </td>
  </ng-container>

  <tr bc-header-row *headerRowDef="let row; columns: columnsToDisplay"></tr>
  <tr bc-data-row *dataRowDef="let row; columns: columnsToDisplay; let i = index"></tr>
</bc-table>
<div class="documents">
  @if (this.download) {
    <bc-button
      [disabled]="selectedDocuments.length === 0"
      (buttonClick)="downloadDocuments(selectedDocuments)"
      label="{{ 'DOCUMENT.DOWNLOAD' | translate }}"
    ></bc-button>
  }

  @if (writeable) {
    <app-filepicker
      (filePicked)="addDocument($event)"
      accept="application/pdf"
      [multiple]="true"
    ></app-filepicker>
  }
</div>
